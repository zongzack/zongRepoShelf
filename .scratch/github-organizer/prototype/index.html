<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GitHub 整理 · UI 原型</title>
  <style>
    :root { --bg:#f6f7fb; --surface:#fff; --surface-2:#f1f3f8; --ink:#172033; --muted:#667085; --line:#dfe3ec; --primary:#635bff; --primary-2:#4f46e5; --success:#13795b; --success-bg:#e7f7ef; --warning:#a15c00; --warning-bg:#fff3dd; --danger:#b42318; --danger-bg:#ffebe9; --radius:16px; --shadow:0 12px 30px rgba(26,32,53,.08); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font-size:16px; line-height:1.5; }
    button, input, select { font:inherit; }
    button { cursor:pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible { outline:3px solid rgba(99,91,255,.35); outline-offset:2px; }
    .prototype-banner { position:fixed; top:14px; right:18px; z-index:40; background:#191d2b; color:#fff; padding:7px 12px; border-radius:999px; font-size:12px; letter-spacing:.02em; box-shadow:0 6px 18px rgba(0,0,0,.18); }
    .shell { min-height:100vh; padding-bottom:94px; }
    .topbar { height:70px; background:rgba(255,255,255,.9); backdrop-filter: blur(16px); border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; padding:0 32px; position:sticky; top:0; z-index:20; }
    .brand { display:flex; gap:11px; align-items:center; font-weight:750; letter-spacing:-.02em; }
    .brand-mark { width:30px; height:30px; border-radius:10px; background:linear-gradient(135deg,#7c74ff,#4f46e5); color:#fff; display:grid; place-items:center; font-size:14px; font-weight:800; }
    .top-actions { display:flex; align-items:center; gap:10px; }
    .avatar { width:34px; height:34px; border-radius:50%; display:grid; place-items:center; color:#fff; background:#23304b; font-weight:700; font-size:13px; }
    .btn { border:1px solid var(--line); background:var(--surface); color:var(--ink); min-height:42px; padding:0 15px; border-radius:11px; font-weight:650; transition:transform .18s ease, box-shadow .18s ease, background .18s ease; }
    .btn:hover { transform:translateY(-1px); box-shadow:0 7px 15px rgba(26,32,53,.1); }
    .btn.primary { background:var(--primary); color:#fff; border-color:var(--primary); }
    .btn.primary:hover { background:var(--primary-2); }
    .btn.ghost { background:transparent; }
    .btn.danger { color:var(--danger); border-color:#f5b9b4; background:#fff8f7; }
    .btn.small { min-height:36px; padding:0 11px; font-size:14px; }
    .layout { max-width:1440px; margin:0 auto; padding:30px 32px; }
    .eyebrow { color:var(--primary-2); text-transform:uppercase; font-weight:800; letter-spacing:.11em; font-size:12px; }
    h1,h2,h3,p { margin:0; }
    h1 { font-size:32px; line-height:1.15; letter-spacing:-.04em; }
    h2 { font-size:22px; letter-spacing:-.025em; }
    h3 { font-size:17px; letter-spacing:-.015em; }
    .muted { color:var(--muted); }
    .mono { font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:13px; }
    .pill { display:inline-flex; align-items:center; gap:6px; border-radius:999px; padding:5px 9px; font-size:12px; font-weight:750; white-space:nowrap; }
    .pill.warn { background:var(--warning-bg); color:var(--warning); }
    .pill.danger { background:var(--danger-bg); color:var(--danger); }
    .pill.ok { background:var(--success-bg); color:var(--success); }
    .pill.neutral { background:var(--surface-2); color:#4b5565; }
    .dot { width:7px; height:7px; border-radius:50%; background:currentColor; }
    .stat-row { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin:24px 0; }
    .stat { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:17px 18px; box-shadow:0 2px 8px rgba(26,32,53,.03); }
    .stat .number { display:block; font-size:28px; font-weight:780; letter-spacing:-.04em; margin-top:3px; }
    .stat .label { color:var(--muted); font-size:13px; }
    .toolbar { display:flex; flex-wrap:wrap; gap:10px; align-items:center; padding:13px; border:1px solid var(--line); background:var(--surface); border-radius:14px; margin-bottom:18px; }
    .toolbar input, .toolbar select { min-height:40px; border:1px solid var(--line); border-radius:10px; background:#fff; padding:0 12px; color:var(--ink); }
    .toolbar input { min-width:230px; }
    .toolbar .spacer { flex:1; }
    .section-head { display:flex; align-items:flex-end; justify-content:space-between; gap:15px; margin:28px 0 14px; }
    .section-head p { font-size:14px; margin-top:5px; }
    .empty { border:1px dashed #c7ccda; border-radius:16px; padding:38px; text-align:center; background:rgba(255,255,255,.55); }
    .repo-title { display:flex; align-items:center; gap:9px; }
    .repo-icon { width:30px; height:30px; border-radius:9px; background:#edf0ff; color:var(--primary-2); display:grid; place-items:center; font-weight:800; font-size:12px; }
    .evidence { display:flex; flex-wrap:wrap; gap:7px; margin-top:13px; }
    .evidence span { border:1px solid var(--line); border-radius:8px; padding:5px 8px; font-size:12px; color:#4b5565; background:#fbfcfe; }
    .evidence span strong { color:var(--ink); }
    .action-row { display:flex; flex-wrap:wrap; gap:8px; margin-top:16px; }
    .action-row .btn { min-height:37px; font-size:13px; }

    /* Variant A — review queue */
    .a-layout { display:grid; grid-template-columns:220px minmax(0,1fr); gap:26px; }
    .a-sidebar { border-right:1px solid var(--line); padding-right:21px; min-height:660px; }
    .side-label { color:#98a1b2; text-transform:uppercase; font-size:11px; font-weight:800; letter-spacing:.1em; margin:12px 0 8px; }
    .side-nav { display:grid; gap:4px; }
    .side-nav button { border:0; background:transparent; text-align:left; border-radius:10px; padding:10px 11px; color:#4b5565; font-weight:650; display:flex; justify-content:space-between; align-items:center; }
    .side-nav button.active, .side-nav button:hover { background:#eeedff; color:var(--primary-2); }
    .count { font-size:12px; color:#8a93a4; }
    .a-main { min-width:0; }
    .a-hero { display:flex; justify-content:space-between; align-items:flex-start; gap:20px; margin-bottom:22px; }
    .a-hero .sub { margin-top:8px; color:var(--muted); max-width:620px; }
    .queue { display:grid; gap:12px; }
    .queue-card { background:#fff; border:1px solid var(--line); border-radius:16px; padding:18px 20px; box-shadow:0 4px 12px rgba(26,32,53,.04); }
    .queue-card:hover { border-color:#b9b4ff; }
    .queue-top { display:flex; justify-content:space-between; gap:14px; align-items:flex-start; }
    .queue-title { display:flex; gap:12px; }
    .queue-title .repo-icon { width:38px; height:38px; border-radius:12px; }
    .queue-title h3 { margin-top:1px; }
    .queue-title p { font-size:13px; margin-top:4px; }
    .recommendation { margin-top:15px; border-left:3px solid #7c74ff; background:#f7f6ff; padding:11px 13px; border-radius:0 10px 10px 0; font-size:14px; }
    .recommendation strong { color:#4c45c9; }

    /* Variant B — table + detail */
    .b-layout { display:grid; grid-template-columns:minmax(0,1fr) 360px; gap:18px; align-items:start; }
    .table-wrap { background:#fff; border:1px solid var(--line); border-radius:16px; overflow:auto; box-shadow:0 4px 12px rgba(26,32,53,.04); }
    table { border-collapse:collapse; width:100%; min-width:760px; }
    th, td { padding:14px 15px; border-bottom:1px solid #edf0f5; text-align:left; vertical-align:middle; }
    th { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:#8992a3; background:#fafbfc; }
    tbody tr { transition:background .18s ease; }
    tbody tr:hover { background:#fafaff; }
    tbody tr.selected { background:#f0efff; }
    .repo-cell { display:flex; gap:10px; align-items:center; }
    .repo-cell .repo-icon { flex:0 0 auto; }
    .repo-cell .mono { color:#4c45c9; }
    .b-detail { position:sticky; top:90px; background:#fff; border:1px solid var(--line); border-radius:16px; padding:20px; box-shadow:var(--shadow); }
    .detail-header { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
    .detail-description { color:var(--muted); font-size:14px; margin-top:12px; }
    .signal-list { display:grid; gap:10px; margin:18px 0; }
    .signal { display:flex; align-items:flex-start; gap:9px; font-size:13px; }
    .signal-mark { width:21px; height:21px; border-radius:7px; display:grid; place-items:center; font-size:12px; font-weight:800; flex:0 0 auto; }
    .signal-mark.warn { background:var(--warning-bg); color:var(--warning); }
    .signal-mark.ok { background:var(--success-bg); color:var(--success); }
    .detail-block { padding-top:15px; margin-top:15px; border-top:1px solid var(--line); }
    .detail-block h4 { margin:0 0 9px; font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:#8992a3; }
    .list-chips { display:flex; flex-wrap:wrap; gap:7px; }
    .list-chip { padding:6px 9px; border-radius:8px; background:#f0efff; color:#4c45c9; font-size:12px; font-weight:700; }

    /* Variant C — lists workbench */
    .c-header { display:flex; justify-content:space-between; align-items:flex-end; gap:16px; margin-bottom:24px; }
    .c-header p { color:var(--muted); margin-top:7px; }
    .c-grid { display:grid; grid-template-columns:240px minmax(0,1fr); gap:20px; }
    .list-rail { background:#1e2538; color:#e7eaf2; border-radius:18px; padding:18px 13px; min-height:610px; }
    .list-rail h3 { padding:0 8px; font-size:14px; color:#fff; }
    .list-rail .rail-hint { color:#9ca7bc; font-size:12px; padding:7px 8px 17px; }
    .rail-item { display:flex; justify-content:space-between; align-items:center; padding:10px 9px; border-radius:10px; margin:3px 0; font-size:14px; color:#cbd3e2; }
    .rail-item.active { background:#5149d6; color:#fff; }
    .rail-item:hover { background:#303a56; }
    .rail-item .count { color:#aeb8cc; }
    .rail-add { margin-top:14px; width:100%; border:1px dashed #687593; color:#cbd3e2; background:transparent; border-radius:10px; padding:10px; }
    .board { min-width:0; }
    .board-toolbar { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:14px; }
    .board-toolbar .view-note { color:var(--muted); font-size:13px; }
    .board-columns { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }
    .board-col { background:#eef0f6; border-radius:16px; padding:12px; min-height:550px; }
    .board-col h3 { display:flex; justify-content:space-between; align-items:center; font-size:14px; padding:3px 5px 10px; }
    .drop-zone { border:1px dashed #c2c8d7; border-radius:12px; min-height:54px; display:grid; place-items:center; color:#8992a3; font-size:12px; margin-bottom:10px; }
    .mini-card { background:#fff; border:1px solid #e0e4ed; border-radius:13px; padding:14px; margin-bottom:10px; box-shadow:0 3px 8px rgba(26,32,53,.05); }
    .mini-card .repo-title { align-items:flex-start; }
    .mini-card .repo-icon { width:28px; height:28px; }
    .mini-card h3 { font-size:14px; }
    .mini-card p { font-size:12px; color:var(--muted); margin-top:5px; }
    .mini-card .evidence { margin-top:10px; }
    .mini-card .evidence span { padding:4px 6px; font-size:11px; }
    .mini-actions { display:flex; gap:6px; margin-top:11px; }
    .mini-actions .btn { min-height:33px; padding:0 8px; font-size:12px; }

    .switcher { position:fixed; z-index:50; bottom:18px; left:50%; transform:translateX(-50%); display:flex; align-items:center; gap:8px; background:#171b29; color:#fff; border:1px solid #31384e; border-radius:999px; padding:7px 9px; box-shadow:0 12px 35px rgba(14,18,31,.3); }
    .switcher button { width:36px; height:36px; border:0; border-radius:50%; background:#2a3145; color:#fff; font-size:18px; }
    .switcher button:hover { background:#4f46e5; }
    .switcher .switcher-label { min-width:170px; text-align:center; font-size:13px; font-weight:700; }
    .toast { position:fixed; right:24px; bottom:84px; z-index:60; background:#172033; color:#fff; padding:12px 15px; border-radius:11px; box-shadow:var(--shadow); font-size:14px; opacity:0; transform:translateY(10px); pointer-events:none; transition:opacity .2s ease, transform .2s ease; }
    .toast.show { opacity:1; transform:translateY(0); }
    .modal-backdrop { position:fixed; inset:0; background:rgba(13,18,31,.58); z-index:80; display:none; align-items:center; justify-content:center; padding:20px; }
    .modal-backdrop.open { display:flex; }
    .modal { width:min(520px,100%); background:#fff; border-radius:18px; padding:24px; box-shadow:0 24px 70px rgba(0,0,0,.3); }
    .modal h2 { color:var(--danger); }
    .modal p { margin-top:9px; color:var(--muted); font-size:14px; }
    .modal label { display:block; margin-top:18px; font-size:13px; font-weight:700; }
    .modal input { width:100%; margin-top:7px; min-height:44px; border:1px solid var(--line); border-radius:10px; padding:0 12px; }
    .modal-actions { display:flex; justify-content:flex-end; gap:9px; margin-top:20px; }
    @media (max-width: 980px) { .a-layout,.c-grid { grid-template-columns:1fr; } .a-sidebar { min-height:auto; border-right:0; border-bottom:1px solid var(--line); padding:0 0 13px; } .side-nav { display:flex; flex-wrap:wrap; } .side-nav button { flex:1 1 150px; } .b-layout { grid-template-columns:1fr; } .b-detail { position:static; } }
    @media (max-width: 640px) { .topbar { padding:0 16px; } .layout { padding:22px 16px 40px; } .top-actions .btn.ghost { display:none; } h1 { font-size:27px; } .stat-row { grid-template-columns:repeat(2,1fr); } .stat .number { font-size:24px; } .toolbar input { min-width:100%; } .a-hero,.c-header { flex-direction:column; align-items:stretch; } .board-columns { grid-template-columns:1fr; } .switcher .switcher-label { min-width:130px; font-size:12px; } }
    @media (prefers-reduced-motion: reduce) { *,*::before,*::after { transition-duration:.01ms !important; animation-duration:.01ms !important; } }
  </style>
</head>
<body>
  <div class="prototype-banner">PROTOTYPE · 仅用于 UI/UX 评估</div>
  <div id="app" class="shell"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="modal-backdrop" id="deleteModal" role="dialog" aria-modal="true" aria-labelledby="deleteTitle">
    <div class="modal">
      <h2 id="deleteTitle">删除仓库</h2>
      <p>这是不可由本工具恢复的 GitHub 操作。原型不会真的调用 GitHub API，但正式产品必须要求你输入完整仓库名并再次确认。</p>
      <label for="confirmRepo">输入 <span class="mono" id="targetRepo">octo-lab/legacy-api</span> 继续</label>
      <input id="confirmRepo" autocomplete="off" placeholder="owner/repo" />
      <div class="modal-actions"><button class="btn" id="cancelDelete">取消</button><button class="btn danger" id="confirmDelete">确认删除</button></div>
    </div>
  </div>
  <script>
    // PROTOTYPE QUESTION: Which information architecture best supports reviewing stale GitHub projects and safely applying List / Star / repository actions?
    const variants = [
      { key:'A', name:'审阅队列', render:renderA },
      { key:'B', name:'批量表格', render:renderB },
      { key:'C', name:'Lists 工作台', render:renderC }
    ];
    const repos = [
      {id:'legacy-api', name:'octo-lab/legacy-api', desc:'A small REST gateway used in an older internal stack.', signal:'长期无提交', signalTone:'warn', commit:'14 个月前', release:'20 个月前', activity:'8 个月前', lists:['基础设施'], owner:true, fork:false},
      {id:'paper-ui', name:'mira/paper-ui', desc:'Accessible components for content-heavy interfaces.', signal:'近期无协作活动', signalTone:'warn', commit:'4 个月前', release:'7 个月前', activity:'8 个月前', lists:['前端','学习'], owner:false, fork:false},
      {id:'tiny-embeddings', name:'kai/tiny-embeddings', desc:'Minimal embedding experiments for local search.', signal:'已 archived', signalTone:'danger', commit:'2 年前', release:'2 年前', activity:'2 年前', lists:[], owner:false, fork:false},
      {id:'mono-tools', name:'zong/mono-tools', desc:'Personal fork with a few unreleased experiments.', signal:'长期无发布', signalTone:'warn', commit:'3 个月前', release:'22 个月前', activity:'2 个月前', lists:['实验'], owner:true, fork:true},
      {id:'shipfast', name:'shipfast/shipfast', desc:'Opinionated tooling for small product teams.', signal:'状态正常', signalTone:'ok', commit:'3 天前', release:'1 个月前', activity:'1 周前', lists:['工具'], owner:false, fork:false}
    ];
    const state = { selected:'legacy-api', filter:'all', search:'', pending:0 };
    function initials(name){ return name.split('/')[1].slice(0,2).toUpperCase(); }
    function visibleRepos(){ return repos.filter(r => (!state.search || r.name.toLowerCase().includes(state.search.toLowerCase())) && (state.filter==='all' || (state.filter==='needs' ? r.signalTone!=='ok' : r.lists.includes(state.filter)))); }
    function repoCard(r){ return `<article class="queue-card" data-repo="${r.id}"><div class="queue-top"><div class="queue-title"><div class="repo-icon">${initials(r.name)}</div><div><h3>${r.name}</h3><p class="muted">${r.desc}</p></div></div><span class="pill ${r.signalTone}"><i class="dot"></i>${r.signal}</span></div><div class="evidence"><span>最近 commit <strong>${r.commit}</strong></span><span>最近 release <strong>${r.release}</strong></span><span>Issue / PR <strong>${r.activity}</strong></span></div><div class="recommendation"><strong>建议：</strong>${r.signalTone==='ok'?'保留当前关系，暂不处理。':'查看证据后考虑取消 Star或加入合适的 List。'}</div><div class="action-row"><button class="btn small" onclick="selectRepo('${r.id}')">查看详情</button><button class="btn small" onclick="toast('已加入批量操作预览')">加入批量预览</button>${r.owner?`<button class="btn small danger" onclick="openDelete('${r.name}')">删除仓库</button>`:''}</div></article>`; }
    function baseTop(){ return `<header class="topbar"><div class="brand"><div class="brand-mark">GH</div><span>GitHub 整理</span></div><div class="top-actions"><button class="btn ghost small" onclick="toast('原型：这里会打开设置')">设置</button><button class="btn primary small" onclick="toast('原型：开始扫描（不会访问 GitHub）')">开始扫描</button><div class="avatar" aria-label="当前用户">Z</div></div></header>`; }
    function stats(){ return `<div class="stat-row"><div class="stat"><span class="label">待处理条目</span><span class="number">32</span><span class="muted">命中至少一项信号</span></div><div class="stat"><span class="label">已 Star</span><span class="number">184</span><span class="muted">上次扫描 2 分钟前</span></div><div class="stat"><span class="label">Lists</span><span class="number">7</span><span class="muted">3 个有待处理项目</span></div><div class="stat"><span class="label">上次操作</span><span class="number">12</span><span class="muted">全部已记录</span></div></div>`; }
    function toolbar(){ return `<div class="toolbar"><input aria-label="搜索项目" placeholder="搜索 owner/repo" oninput="state.search=this.value; rerender()" value="${state.search}"><select aria-label="筛选信号" onchange="state.filter=this.value; rerender()"><option value="all">全部项目</option><option value="needs">仅看待处理</option><option value="基础设施">List：基础设施</option><option value="学习">List：学习</option></select><button class="btn small" onclick="toast('原型：打开阈值设置')">调整阈值</button><span class="spacer"></span><button class="btn small" onclick="toast('原型：已生成批量动作预览')">批量操作预览 <span class="pill neutral">${state.pending}</span></button></div>`; }
    function renderA(){ return `${baseTop()}<main class="layout"><div class="a-layout"><aside class="a-sidebar"><div class="side-label">工作区</div><nav class="side-nav"><button class="active">待处理 <span class="count">32</span></button><button>全部项目 <span class="count">184</span></button></nav><div class="side-label">Lists</div><nav class="side-nav"><button>基础设施 <span class="count">28</span></button><button>学习 <span class="count">41</span></button><button>前端 <span class="count">36</span></button><button>实验 <span class="count">12</span></button></nav><button class="btn small" style="width:100%;margin-top:18px" onclick="toast('原型：新建 List')">+ 新建 List</button></aside><section class="a-main"><div class="a-hero"><div><div class="eyebrow">Review queue</div><h1>先看最值得处理的项目</h1><p class="sub">每条建议都带着证据。你确认后，才会执行取消 Star、List 归类或仓库操作。</p></div><button class="btn primary" onclick="toast('原型：批量确认流程')">审阅选中项目</button></div>${stats()}${toolbar()}<div class="section-head"><div><h2>待处理清单</h2><p class="muted">按信号优先级排序 · ${visibleRepos().length} 条示例数据</p></div><span class="pill warn">需要你的判断</span></div><div class="queue">${visibleRepos().map(repoCard).join('') || '<div class="empty">没有匹配的项目。试试切换筛选条件。</div>'}</div></section></div></main>`; }
    function renderB(){ const rows=visibleRepos(); const selected=repos.find(r=>r.id===state.selected)||repos[0]; return `${baseTop()}<main class="layout"><div class="section-head" style="margin-top:0"><div><div class="eyebrow">Triage table</div><h1>批量看清楚，再一次执行</h1><p class="muted">表格适合快速比较时间戳、状态和 List 关系；右侧保留完整证据。</p></div><button class="btn primary" onclick="toast('原型：已加入分组确认')">确认批量动作</button></div>${stats()}${toolbar()}<div class="b-layout"><div class="table-wrap"><table><thead><tr><th><input type="checkbox" aria-label="选择全部"></th><th>项目条目</th><th>健康信号</th><th>最近 commit</th><th>Lists</th><th>关系</th></tr></thead><tbody>${rows.map(r=>`<tr class="${r.id===state.selected?'selected':''}" onclick="selectRepo('${r.id}')"><td><input type="checkbox" aria-label="选择 ${r.name}" onclick="event.stopPropagation(); state.pending++; rerender()"></td><td><div class="repo-cell"><div class="repo-icon">${initials(r.name)}</div><div><div class="mono">${r.name}</div><div class="muted" style="font-size:12px">${r.desc}</div></div></div></td><td><span class="pill ${r.signalTone}">${r.signal}</span></td><td class="mono">${r.commit}</td><td>${r.lists.length? r.lists.map(l=>`<span class="list-chip">${l}</span>`).join(' '):'<span class="muted">未归类</span>'}</td><td>${r.owner?'<span class="pill neutral">Owned</span>':'<span class="pill neutral">Starred</span>'}</td></tr>`).join('')}</tbody></table></div><aside class="b-detail"><div class="detail-header"><div><div class="eyebrow">Selected item</div><h2>${selected.name}</h2></div><button class="btn small" aria-label="关闭详情" onclick="toast('原型：详情面板保持打开')">×</button></div><p class="detail-description">${selected.desc}</p><div class="signal-list"><div class="signal"><span class="signal-mark ${selected.signalTone}">!</span><span><strong>${selected.signal}</strong><br><span class="muted">最近 commit：${selected.commit}</span></span></div><div class="signal"><span class="signal-mark warn">R</span><span>最近 release：<strong>${selected.release}</strong></span></div><div class="signal"><span class="signal-mark ok">P</span><span>近期 issue / PR：<strong>${selected.activity}</strong></span></div></div><div class="detail-block"><h4>当前 Lists</h4><div class="list-chips">${selected.lists.length?selected.lists.map(l=>`<span class="list-chip">${l}</span>`).join(''):'<span class="muted">尚未加入 List</span>'}</div><div class="action-row"><button class="btn small primary" onclick="toast('原型：打开 List 选择器')">加入 List</button><button class="btn small" onclick="toast('原型：移出 List')">移出 List</button></div></div><div class="detail-block"><h4>整理动作</h4><div class="action-row"><button class="btn small" onclick="toast('原型：取消 Star')">取消 Star</button>${selected.owner?`<button class="btn small" onclick="toast('原型：Archive / Unarchive')">Archive</button><button class="btn small danger" onclick="openDelete('${selected.name}')">删除仓库</button>`:''}</div></div></aside></div></main>`; }
    function renderC(){ return `${baseTop()}<main class="layout"><div class="c-header"><div><div class="eyebrow">Lists workbench</div><h1>把分类变成下一步</h1><p>从 List 出发查看待处理项目，再决定保留、归类或移除关系。</p></div><button class="btn primary" onclick="toast('原型：保存 List 规则')">管理归类规则</button></div>${stats()}<div class="c-grid"><aside class="list-rail"><h3>GitHub Lists</h3><div class="rail-hint">默认支持多归类</div><div class="rail-item active" onclick="toast('原型：查看全部待处理')">待处理 <span class="count">32</span></div><div class="rail-item" onclick="toast('原型：切换到基础设施')">基础设施 <span class="count">28</span></div><div class="rail-item" onclick="toast('原型：切换到学习')">学习 <span class="count">41</span></div><div class="rail-item" onclick="toast('原型：切换到前端')">前端 <span class="count">36</span></div><div class="rail-item" onclick="toast('原型：切换到实验')">实验 <span class="count">12</span></div><button class="rail-add" onclick="toast('原型：新建 List')">+ 新建 List</button></aside><section class="board"><div class="board-toolbar"><span class="view-note">拖动在这里仅用于探索，不会真的写回 GitHub</span><div><button class="btn small" onclick="toast('原型：筛选未归类')">仅看未归类</button> <button class="btn small" onclick="toast('原型：打开批量预览')">批量预览</button></div></div><div class="board-columns"><div class="board-col"><h3>待决定 <span class="pill neutral">3</span></h3>${repos.filter(r=>r.signalTone!=='ok').slice(0,2).map(r=>`<article class="mini-card"><div class="repo-title"><div class="repo-icon">${initials(r.name)}</div><div><h3>${r.name}</h3><p>${r.desc}</p></div></div><div class="evidence"><span>${r.signal}</span><span>commit ${r.commit}</span></div><div class="mini-actions"><button class="btn small" onclick="toast('原型：打开 List 选择器')">加入 List</button><button class="btn small" onclick="toast('原型：取消 Star')">取消 Star</button></div></article>`).join('')}<div class="drop-zone">把项目拖到这里模拟归类</div></div><div class="board-col"><h3>已归类 · 学习 <span class="pill neutral">2</span></h3>${repos.filter(r=>r.lists.includes('学习')).map(r=>`<article class="mini-card"><div class="repo-title"><div class="repo-icon">${initials(r.name)}</div><div><h3>${r.name}</h3><p>${r.desc}</p></div></div><div class="evidence"><span class="pill ${r.signalTone}">${r.signal}</span></div><div class="mini-actions"><button class="btn small" onclick="toast('原型：移出学习 List')">移出 List</button><button class="btn small" onclick="openDelete('${r.name}')">更多</button></div></article>`).join('')}<div class="drop-zone">拖入项目以加入学习</div></div></div></section></div></main>`; }
    function selectRepo(id){ state.selected=id; rerender(); }
    function toast(msg){ const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show'); clearTimeout(window.__toast); window.__toast=setTimeout(()=>el.classList.remove('show'),2600); }
    function openDelete(name){ document.getElementById('targetRepo').textContent=name; document.getElementById('confirmRepo').value=''; document.getElementById('deleteModal').classList.add('open'); setTimeout(()=>document.getElementById('confirmRepo').focus(),50); }
    function closeDelete(){ document.getElementById('deleteModal').classList.remove('open'); }
    function rerender(){ const key=new URLSearchParams(location.search).get('variant')||'A'; const variant=variants.find(v=>v.key===key)||variants[0]; document.getElementById('app').innerHTML=variant.render(); updateSwitcher(variant); }
    function setVariant(key){ const url=new URL(location.href); url.searchParams.set('variant',key); history.replaceState({},'',url); rerender(); }
    function updateSwitcher(variant){ let el=document.querySelector('.switcher'); if(!el){ el=document.createElement('div'); el.className='switcher'; el.innerHTML='<button aria-label="上一个方案" id="prevVariant">‹</button><span class="switcher-label"></span><button aria-label="下一个方案" id="nextVariant">›</button>'; document.body.appendChild(el); document.getElementById('prevVariant').onclick=()=>cycle(-1); document.getElementById('nextVariant').onclick=()=>cycle(1); } el.querySelector('.switcher-label').textContent=`${variant.key} · ${variant.name}`; }
    function cycle(delta){ const current=new URLSearchParams(location.search).get('variant')||'A'; const i=variants.findIndex(v=>v.key===current); setVariant(variants[(i+delta+variants.length)%variants.length].key); }
    document.addEventListener('keydown', e=>{ if(e.target.matches('input,textarea,select,[contenteditable="true"]')) return; if(e.key==='ArrowLeft') cycle(-1); if(e.key==='ArrowRight') cycle(1); if(e.key==='Escape') closeDelete(); });
    document.getElementById('cancelDelete').onclick=closeDelete;
    document.getElementById('confirmDelete').onclick=()=>{ const target=document.getElementById('targetRepo').textContent; const typed=document.getElementById('confirmRepo').value.trim(); if(typed!==target){ toast('请输入完整 owner/repo 名称'); return; } closeDelete(); toast('原型：删除意图已记录（不会真的删除）'); };
    window.addEventListener('popstate', rerender);
    rerender();
  </script>
</body>
</html>
